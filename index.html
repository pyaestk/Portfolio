<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Pyae Sone Thant Kyaw, an aspiring software developer and freelance Android developer."
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("portfolio-theme") || localStorage.getItem("theme");
        const theme = savedTheme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch { document.documentElement.dataset.theme = "light"; }
    </script>
    <title>Pyae Sone Thant Kyaw - Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
